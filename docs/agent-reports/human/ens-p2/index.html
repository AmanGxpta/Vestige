<!doctype html><html lang="en"><meta charset="utf-8"><title>Vestige — Sepolia ENS parent setup P2</title><style>body{font:17px system-ui;max-width:850px;margin:50px auto;padding:20px;background:#151515;color:#eee}code,pre{overflow-wrap:anywhere;white-space:pre-wrap}button{padding:12px;margin:10px 10px 10px 0}dt{margin-top:16px;font-weight:bold}</style><h1>Vestige ENS parent setup — P2</h1><p>Ethereum Sepolia testnet. This transaction points vestige.eth to its deployed parent registry. Review the values below in your wallet.</p><dl><dt>Owner wallet</dt><dd id="owner"></dd><dt>Contract receiving the transaction</dt><dd id="to"></dd><dt>New parent registry</dt><dd id="parent"></dd><dt>ETH sent</dt><dd>0 (Sepolia ETH gas only)</dd><dt>Transaction data</dt><dd><code id="data"></code></dd></dl><button id="connect">Connect owner wallet</button><button id="send" disabled>Send P2 — confirm in wallet</button><pre id="status"></pre><script>
const owner='0x1ed73ee055b7B5379CcD398748281C5A82e9A41E',to='0xd4ebcbbdf463c9c45784603db0ddd499bc44a8b4',parent='0x61Dc50fE2099012bD1d0A684192071Ef51d7Aa73',data='0x341ec55921952812fa04808958af603a28aa8649e7195d3c1132e4c434170bdc25da1fd800000000000000000000000061dc50fe2099012bd1d0a684192071ef51d7aa73';
for(const [id,value] of Object.entries({owner,to,parent,data}))document.getElementById(id).textContent=value;
const status=document.getElementById('status'),send=document.getElementById('send');let account;
async function check(){if(!window.ethereum)throw Error('Open this page in your browser with MetaMask enabled.');await ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:'0xaa36a7'}]});const accounts=await ethereum.request({method:'eth_requestAccounts'});account=accounts[0];if(account.toLowerCase()!==owner.toLowerCase())throw Error('Select the vestige.eth owner wallet shown above.');const code=await ethereum.request({method:'eth_getCode',params:[parent,'latest']});if(code==='0x')throw Error('P1 deployment has not confirmed.');}
document.getElementById('connect').onclick=async()=>{try{await check();send.disabled=false;status.textContent='Owner connected on Sepolia. Review the transaction, then click Send P2.';}catch(e){send.disabled=true;status.textContent=e.message;}};
send.onclick=async()=>{send.disabled=true;try{await check();const hash=await ethereum.request({method:'eth_sendTransaction',params:[{from:account,to,value:'0x0',data}]});status.textContent='Submitted P2: '+hash+'\nShare this public transaction hash with your agent for receipt and registry verification.';}catch(e){status.textContent=e.message;send.disabled=false;}};
</script></html>
